[versions]

# Android SDK levels for every module
android-compileSdk = "36"
android-minSdk = "23"

atomicfu = "0.33.0"
camera-core = "1.5.3"
camera-extensions = "1.5.3"
camera-lifecycle = "1.5.3"
camera-view = "1.5.3"
zxing = "3.5.4"
kotlin = "2.4.10"
agp = "8.13.2"
dokka = "2.2.0"
spotless = "8.10.4"
kotlinx-coroutines = "1.11.0"
kotlinx-io = "0.9.0"
kermit = "2.2.0"

compose-multiplatform = "1.11.1"
activity = "1.9.2" # https://developer.android.com/jetpack/androidx/releases/activity
coil-mp-version = "3.5.0"
lucide-icons = "2.2.1"
androidx-activityCompose = "1.13.0"
startupRuntime = "1.2.0"
# The JavaCPP release train: javacv and javacpp carry its number, each preset binding its native
# library's version before it. These are the Java bindings only; apps add the natives they ship.
javacpp = "1.5.12"
ffmpeg = "7.1.1-1.5.12"
videoinput = "0.200-1.5.9"
tesseract = "5.5.1-1.5.12"
leptonica = "1.85.0-1.5.12"
textRecognition = "16.0.1"

kflite = "1.1.40"
vanniktech-publish = "0.37.0"

# Test-only
junit = "4.13.2"
robolectric = "4.17"
androidx-test-core = "1.7.0"
# 2.0.0-alpha04 and later are compiled for Java 21; this build runs on JDK 17.
paparazzi = "2.0.0-alpha02"

[libraries]

androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera-view" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startupRuntime" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera-core" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camera-core" }
camera-extensions = { module = "androidx.camera:camera-extensions", version.ref = "camera-extensions" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera-lifecycle" }
camera-video = { module = "androidx.camera:camera-video", version.ref = "camera-core" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-javase = { module = "com.google.zxing:javase", version.ref = "zxing" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
composeGradle = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }

coil3-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil-mp-version" }
coil3-compose-core = { module = "io.coil-kt.coil3:coil-compose-core", version.ref = "coil-mp-version" }
androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
lucide-icons-cmp = { module = "com.composables:icons-lucide-cmp", version.ref = "lucide-icons" }

javacv = { module = "org.bytedeco:javacv", version.ref = "javacpp" }
javacpp = { module = "org.bytedeco:javacpp", version.ref = "javacpp" }
ffmpeg = { module = "org.bytedeco:ffmpeg", version.ref = "ffmpeg" }
videoinput = { module = "org.bytedeco:videoinput", version.ref = "videoinput" }
tesseract = { module = "org.bytedeco:tesseract", version.ref = "tesseract" }
leptonica = { module = "org.bytedeco:leptonica", version.ref = "leptonica" }
text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "textRecognition" }

kflite = {module = "io.github.shadmanadman:kflite", version.ref = "kflite"}

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

[plugins]

multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
