[versions]

# Android SDK levels for every module
android-compileSdk = "36"
android-minSdk = "23"

atomicfu = "0.33.0"
camerax = "1.5.3"
zxing = "3.5.4"
kotlin = "2.4.10"
agp = "8.13.2"
dokka = "2.2.0"
spotless = "8.10.4"
kotlinx-coroutines = "1.11.0"
kotlinx-io = "0.9.0"

compose-multiplatform = "1.11.1"
# Compose Material 3 has its own version line; this is the one compose-multiplatform 1.11.1 ships.
compose-material3 = "1.9.0"
coil-mp-version = "3.5.0"
lucide-icons = "2.2.1"
androidx-activity = "1.13.0"
# cameraK-core's lifecycle-runtime, which has no Compose: its Android 1.x bridge drives a
# LifecycleRegistry. The version is the one activity-compose brought before the module split.
androidx-lifecycle = "2.9.4"
# camerak's Compose lifecycle effects (LifecycleStartEffect, LifecycleResumeEffect, LocalLifecycleOwner):
# the JetBrains multiplatform build, at the version compose-multiplatform 1.11.1's ui depends on.
jetbrains-lifecycle = "2.9.6"
# cameraK-core's Android trace sections. The version CameraX 1.5.3 already brings at runtime.
androidx-tracing = "1.2.0"
# The JavaCPP release train: javacv and javacpp carry its number, each preset binding its native
# library's version before it. These are the Java bindings only; apps add the natives they ship.
javacpp = "1.5.12"
ffmpeg = "7.1.1-1.5.12"
videoinput = "0.200-1.5.9"
tesseract = "5.5.1-1.5.12"
leptonica = "1.85.0-1.5.12"
textRecognition = "16.0.1"
# camerak-core desktop, compile-only: macOS camera authorization through the Objective-C runtime
# (Decision 15). Apps that ship JNA get the real status; without it the status reads as not determined.
jna = "5.14.0"

kflite = "1.1.40"
vanniktech-publish = "0.37.0"
# equals, hashCode and toString for camerak-core's public value classes, which are not data classes.
# Poko is tied to a Kotlin compiler version: 0.23.2 is the release for Kotlin 2.4.0 and later.
poko = "0.23.2"

# Test-only
junit = "4.13.2"
robolectric = "4.17"
androidx-test-core = "1.7.0"
# 2.0.0-alpha04 and later are compiled for Java 21; this build runs on JDK 17.
paparazzi = "2.0.0-alpha02"
# ui-test-manifest declares the ComponentActivity Robolectric launches for camerak's Compose tests. It is
# the androidx Compose UI version compose-multiplatform 1.11.1 resolves on Android, never a newer one.
androidx-compose-ui-test = "1.11.2"

[libraries]

androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-video = { module = "androidx.camera:camera-video", version.ref = "camerax" }
# CameraXViewfinder for camerak's Android preview; it brings viewfinder-compose. Always the camerax ref:
# checkBuildGateRules' camera_compose_must_match_camerax_version fails on any other.
camera-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-javase = { module = "com.google.zxing:javase", version.ref = "zxing" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }

coil3-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil-mp-version" }
coil3-compose-core = { module = "io.coil-kt.coil3:coil-compose-core", version.ref = "coil-mp-version" }
androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrains-lifecycle" }
androidx-tracing = { module = "androidx.tracing:tracing", version.ref = "androidx-tracing" }
lucide-icons-cmp = { module = "com.composables:icons-lucide-cmp", version.ref = "lucide-icons" }

javacv = { module = "org.bytedeco:javacv", version.ref = "javacpp" }
javacpp = { module = "org.bytedeco:javacpp", version.ref = "javacpp" }
ffmpeg = { module = "org.bytedeco:ffmpeg", version.ref = "ffmpeg" }
videoinput = { module = "org.bytedeco:videoinput", version.ref = "videoinput" }
tesseract = { module = "org.bytedeco:tesseract", version.ref = "tesseract" }
leptonica = { module = "org.bytedeco:leptonica", version.ref = "leptonica" }
text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "textRecognition" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

kflite = {module = "io.github.shadmanadman:kflite", version.ref = "kflite"}

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui-test" }

[plugins]

multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
poko = { id = "dev.drewhamilton.poko", version.ref = "poko" }
