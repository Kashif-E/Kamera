name: Device

# CameraK on an Android emulator and an iOS simulator: the engine's device tests, the Sample's device matrix
# and a holder churn with memory and leak checks, judged by scripts/device_gate.py. A simulator has no
# camera and the emulator's is a test pattern, so capture on real hardware stays with the device checklist.
# Runs for main, ci/desktop and release tags rather than every pull request: the iOS job needs a macOS
# runner, which the harness in build.yml needs too.
on:
  push:
    branches:
      - main
      - ci/desktop
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator run (device tests, device matrix, churn)
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6000M
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: bash .github/ci/device-android.sh

      - name: Gate
        run: python3 -I scripts/device_gate.py android ci-out/android

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-android
          if-no-files-found: ignore
          path: ci-out/**

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Select Xcode
        run: scripts/select_xcode.sh

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Gradle heap for the Kotlin/Native link
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - name: Simulator run (Xcode build, device matrix, churn, leaks)
        run: bash .github/ci/device-ios.sh

      - name: Gate
        run: python3 -I scripts/device_gate.py ios ci-out/ios

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-ios
          if-no-files-found: ignore
          path: ci-out/**
