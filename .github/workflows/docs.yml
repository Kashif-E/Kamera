name: Documentation

# Pull requests and pushes to main build the site with --strict and check its links. The public
# site is deployed only for a release tag (v*), from that same strict build, so it never documents
# unreleased API. Deploying through actions/deploy-pages needs the repository's Pages source set to
# "GitHub Actions" and a github-pages environment that allows v* tags.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Generated from docs/requirements.in with hashes; see that file to update it.
      - name: Install dependencies
        run: pip install --require-hashes -r docs/requirements.txt

      - name: Build the site (strict)
        run: mkdocs build --strict --site-dir site

      # Links in code blocks are skipped. Maven Central's search answers automated clients with 403.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --exclude-path docs/superpowers
            --exclude '^https://search\.maven\.org/'
            'docs/**/*.md'
            README.MD

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: site

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
