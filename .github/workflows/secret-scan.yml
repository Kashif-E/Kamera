name: Secret scan

# Pushes to main and pull requests run the gitleaks action over the commits they bring. The weekly
# and manual runs scan every branch and tag with the gitleaks CLI and --log-opts=--all; the action
# cannot, because on those events it scans only the checked-out branch. The full-history job is
# where the leaked publishing credentials still are: it fails until those secrets are rotated and
# their fingerprints go in .gitleaksignore (see CONTRIBUTING.md, "Publishing credentials").
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read
  # The action lists a pull request's commits through the API.
  pull-requests: read

jobs:
  new-commits:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's built-in default is 8.24.3; pin the release .gitleaks.toml is written for.
          GITLEAKS_VERSION: 8.30.1
          # Commenting needs pull-requests: write; findings are in the job summary and SARIF artifact.
          GITLEAKS_ENABLE_COMMENTS: "false"

  full-history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # fetch-depth 0 fetches every branch and tag, which --log-opts=--all then walks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # --redact keeps values out of the public log; --verbose lists each finding's commit, file,
      # rule and fingerprint, which is what .gitleaksignore needs.
      - name: Scan every branch and tag
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --config .gitleaks.toml \
            --log-opts=--all
