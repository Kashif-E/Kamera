name: Secret scan

# Push and pull-request runs scan only the commits they bring. The weekly and manual runs scan the
# full history of every branch and tag, which is where the leaked publishing credentials still are:
# they fail until those secrets are rotated and their fingerprints go in .gitleaksignore (see
# CONTRIBUTING.md, "Publishing credentials").
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read
  # The action lists a pull request's commits through the API.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's built-in default is 8.24.3; pin the release .gitleaks.toml is written for.
          GITLEAKS_VERSION: 8.30.1
          # Commenting needs pull-requests: write; findings are in the job summary and SARIF artifact.
          GITLEAKS_ENABLE_COMMENTS: "false"
