name: Desktop

# The desktop target on the two systems the macOS build job does not cover: every module's JVM tests,
# then the Sample itself, launched with -cameraKSmoke against a virtual camera, so it opens the camera
# through FFmpeg (V4L2 on Linux, DirectShow on Windows), shows the preview and writes a photo.
on:
  pull_request:
  push:
    branches:
      - main
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Runners have no GPU: Skia draws the Compose window in software.
      SKIKO_RENDER_API: SOFTWARE
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Desktop tests (every module)
        run: ./gradlew desktopTest --continue --no-daemon

      - name: Virtual camera (Linux, v4l2loopback fed an FFmpeg test pattern)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)" v4l2loopback-dkms v4l-utils ffmpeg xvfb
          sudo modprobe v4l2loopback devices=1 video_nr=10 card_label="CameraK CI" exclusive_caps=1
          # The node is root:video 0660 once udev has applied its rules; the runner user both feeds it
          # and opens it.
          sudo udevadm settle
          sudo chmod 0666 /dev/video10
          ls -l /dev/video10
          # With exclusive_caps the node advertises capture only once a writer feeds it.
          nohup ffmpeg -nostdin -loglevel error -re -f lavfi -i testsrc2=size=1280x720:rate=30 \
            -pix_fmt yuyv422 -f v4l2 /dev/video10 > ffmpeg-v4l2.log 2>&1 &
          sleep 5
          # udev records a node's capabilities once, when it appears; with exclusive_caps that was
          # output only, before the writer. Read them again now that the node captures.
          sudo udevadm trigger --action=change --subsystem-match=video4linux
          sudo udevadm settle
          udevadm info /dev/video10 | grep V4L_CAPABILITIES || true
          # Diagnostics only: v4l2-ctl exits non-zero when /dev/video0 does not exist.
          v4l2-ctl --list-devices || true
          v4l2-ctl -d /dev/video10 --all | head -20 || true
          cat ffmpeg-v4l2.log

      - name: Virtual camera (Windows, Unity Capture DirectShow filter)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # schellingb/UnityCapture, pinned to a commit and checked against the hash of that commit's DLL.
          $url = 'https://raw.githubusercontent.com/schellingb/UnityCapture/3ed54c325e0ad71afcf4f246c07e5e17b3d7f2d2/Install/UnityCaptureFilter64.dll'
          $dll = Join-Path $env:RUNNER_TEMP 'UnityCaptureFilter64.dll'
          Invoke-WebRequest -Uri $url -OutFile $dll
          $hash = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLower()
          if ($hash -ne '72812f5363d8ecb45632253f8c8c888844b1b62e27616f3c8cc21064ccde25e5') { throw "UnityCaptureFilter64.dll hash $hash" }
          $p = Start-Process regsvr32.exe -ArgumentList '/s', "`"$dll`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "regsvr32 exited $($p.ExitCode)" }

      - name: "Diagnostics: FFmpeg's own CLI lists and grabs the virtual camera (Windows)"
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          ffmpeg -hide_banner -f dshow -list_devices true -i dummy 2>&1 | Select-Object -First 20
          ffmpeg -hide_banner -f dshow -i "video=Unity Video Capture" -frames:v 1 -update 1 -y unity.png 2>&1 | Select-Object -Last 6
          Write-Output "ffmpeg (native mode) exit $LASTEXITCODE"
          ffmpeg -hide_banner -f dshow -list_options true -i "video=Unity Video Capture" 2>&1 | Select-Object -First 25
          # As CameraK opens it: by its alternative name, at 1280x720 and 30 fps.
          $alt = (ffmpeg -hide_banner -f dshow -list_devices true -i dummy 2>&1 | Select-String 'Alternative name "(@device_sw[^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          ffmpeg -hide_banner -f dshow -video_size 1280x720 -framerate 30 -i "video=$alt" -frames:v 1 -update 1 -y unity720.png 2>&1 | Select-Object -Last 6
          Write-Output "ffmpeg (1280x720@30 by alternative name) exit $LASTEXITCODE"
          "CAMERAK_DSHOW_ALT=$alt" >> $env:GITHUB_ENV
          if (Test-Path unity.png) { Get-Item unity.png | Select-Object Name, Length }

      - name: "Diagnostics: JavaCV alone, then CameraK's dshow backend, grab the virtual camera (Windows)"
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          CAMERAK_DSHOW_CAMERA: Unity Video Capture
        shell: pwsh
        run: |
          foreach ($case in "javacvAloneGrabsAFrame", "javacvAloneGrabsByAlternativeName", "cameraKsDshowBackendListsTwiceWithoutOpening", "cameraKsDshowBackendListsAndGrabsAFrame") {
            ./gradlew :cameraK-core:desktopTest --no-daemon --tests "*WindowsCameraDeviceTest.$case" -i 2>&1 | Select-String "WindowsCameraDeviceTest listed|FAILED|NTSTATUS|exit value|list_devices" | Select-Object -First 6
            Write-Output "CASE $case exit $LASTEXITCODE"
          }

      - name: Run the Sample's smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :Sample:run --no-daemon --args="-cameraKSmoke -cameraKSmokeTimeout 90"

      - name: Run the Sample's smoke (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew :Sample:run --no-daemon --args="-cameraKSmoke -cameraKSmokeTimeout 90"

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            */build/reports/tests/**
            */build/test-results/**
            cameraK/build/reports/screenshots-desktop/**
            ffmpeg-v4l2.log
            Sample/hs_err_pid*.log
            hs_err_pid*.log
