name: Upload Library to Maven Central

# A release is a pushed tag named v<VERSION_NAME>. The tagged commit first passes the full
# verification harness (build.yml, reused rather than copied); the upload then waits in the
# protected maven-central environment, whose required reviewers approve it and which alone holds the
# publishing secrets. A Central upload cannot be undone, so nothing else can start one.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/build.yml

  publish:
    needs: verify
    runs-on: macos-15
    environment: maven-central

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # This job holds the signing secrets: check the wrapper jar is a genuine Gradle release first.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Check the tag names the version being published
        run: scripts/check_release_tag.sh "$GITHUB_REF_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Gradle heap for the Kotlin/Native link
        run: |
          mkdir -p ~/.gradle
          touch ~/.gradle/gradle.properties
          # Set (not blindly append) so a re-run / pre-existing entry can't create duplicates.
          sed -i.bak '/^org.gradle.jvmargs=/d' ~/.gradle/gradle.properties && rm -f ~/.gradle/gradle.properties.bak
          # macos-15 is Apple silicon with ~7 GB; -Xmx5g leaves room for the Kotlin/Native linker itself.
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      # Gradle reads ORG_GRADLE_PROJECT_* as project properties. Secrets stay out of the command line
      # and off the disk: the signing key is the ASCII-armored export, held in memory.
      # Two builds, so each namespace is its own Central Portal deployment: the libraries under GROUP,
      # then the 1.x relocation POMs under LEGACY_GROUP. A failed first step stops the second.
      - name: Publish the libraries to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishLibraries --no-configuration-cache

      - name: Publish the 1.x relocation POMs to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishLegacyRelocations --no-configuration-cache
