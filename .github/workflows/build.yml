name: Build

on:
  pull_request:
  push:
    branches:
      - main
  # The publish workflow runs this same job on the release tag before it uploads anything.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # Pinned to the image the release workflow uses; screenshot goldens are recorded on macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Cache Robolectric Android SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@v4

      - name: Set Gradle heap for the Kotlin/Native link
        run: |
          mkdir -p ~/.gradle
          touch ~/.gradle/gradle.properties
          sed -i.bak '/^org.gradle.jvmargs=/d' ~/.gradle/gradle.properties && rm -f ~/.gradle/gradle.properties.bak
          # macos-15 is Apple silicon with ~7 GB; -Xmx5g leaves room for the Kotlin/Native linker itself.
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - name: Verify (spotless, tests on every target, release and device compiles, screenshots, Sample)
        run: scripts/verify.sh --full -- --no-daemon

      - name: Upload verification results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          if-no-files-found: ignore
          path: |
            build/verify/**
            */build/reports/tests/**
            */build/test-results/**
            cameraK/build/reports/screenshots-desktop/**
            cameraKScreenshotTests/build/paparazzi/failures/**
