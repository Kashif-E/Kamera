name: Full test

# One pass over every platform CameraK targets: the whole verification (every target's tests, lint,
# screenshots, publishing) on macOS; the Sample's device matrix and a holder churn with memory sampled on
# Linux and Windows against virtual cameras, on an Android emulator (with the engine's device contract and
# the Macrobenchmark) and on an iOS simulator (with `leaks`). Results are uploaded per job.
on:
  push:
    branches:
      - 'ci/full-test'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/build.yml

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      SKIKO_RENDER_API: SOFTWARE
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Virtual camera and microphone (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)" v4l2loopback-dkms v4l-utils ffmpeg xvfb \
            pulseaudio pulseaudio-utils libasound2-plugins
          sudo modprobe v4l2loopback devices=1 video_nr=10 card_label="CameraK CI" exclusive_caps=1
          sudo udevadm settle
          sudo chmod 0666 /dev/video10
          nohup ffmpeg -nostdin -loglevel error -re -f lavfi -i testsrc2=size=1280x720:rate=30 \
            -pix_fmt yuyv422 -f v4l2 /dev/video10 > ffmpeg-v4l2.log 2>&1 &
          sleep 5
          sudo udevadm trigger --action=change --subsystem-match=video4linux
          sudo udevadm settle
          # A null sink's monitor is the default source, fed a tone: ALSA's default device is PulseAudio.
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_mic
          pactl set-default-source ci_mic.monitor
          nohup ffmpeg -nostdin -loglevel error -re -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -f pulse -device ci_mic "CameraK CI tone" > ffmpeg-pulse.log 2>&1 &
          sleep 2
          pactl list short sources

      - name: Virtual camera (Windows, Unity Capture DirectShow filter)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://raw.githubusercontent.com/schellingb/UnityCapture/3ed54c325e0ad71afcf4f246c07e5e17b3d7f2d2/Install/UnityCaptureFilter64.dll'
          $dll = Join-Path $env:RUNNER_TEMP 'UnityCaptureFilter64.dll'
          Invoke-WebRequest -Uri $url -OutFile $dll
          $hash = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLower()
          if ($hash -ne '72812f5363d8ecb45632253f8c8c888844b1b62e27616f3c8cc21064ccde25e5') { throw "UnityCaptureFilter64.dll hash $hash" }
          $p = Start-Process regsvr32.exe -ArgumentList '/s', "`"$dll`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "regsvr32 exited $($p.ExitCode)" }

      - name: Build the Sample
        run: ./gradlew :Sample:desktopMainClasses --no-daemon

      - name: Device matrix (every section)
        run: bash .github/ci/desktop-matrix.sh matrix 90 60 -cameraKMatrix -cameraKMatrixLog

      - name: Holder churn (3000 opens and closes)
        run: bash .github/ci/desktop-matrix.sh churn 40 10 -cameraKMatrix -cameraKMatrixChurn 3000

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            ci-out/**
            ffmpeg-*.log
            Sample/hs_err_pid*.log
            hs_err_pid*.log

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator run (device contract, device matrix, churn, Macrobenchmark)
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6000M
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: bash .github/ci/android.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator
          if-no-files-found: ignore
          path: ci-out/**

  ios:
    # Kotlin 2.4.10 is tested with Xcode 26.4, and Compose Multiplatform 1.11 links against iOS 26 SDK
    # classes (UIViewLayoutRegion): the macos-15 image's default Xcode 16.4 cannot link the app.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app && xcodebuild -version

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Gradle heap for the Kotlin/Native link
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - name: Simulator run (Xcode build, device matrix, churn, leaks)
        run: bash .github/ci/ios.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator
          if-no-files-found: ignore
          path: ci-out/**
