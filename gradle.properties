#Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true
org.jetbrains.compose.experimental.macos.enabled=true
org.gradle.configuration-cache=false


#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

#Release coordinates and POM, shared by every published module. vanniktech maven-publish reads
#GROUP, VERSION_NAME and POM_*; each module's own gradle.properties adds POM_ARTIFACT_ID, POM_NAME
#and POM_DESCRIPTION. The root build sets project.group and project.version from the same keys.
GROUP=dev.kashifmehmood
#The 1.x group. Only the relocation POMs under relocations/ publish here, each relocating a 1.x
#coordinate to its successor under GROUP (scripts/check_repo_policy.py published-group).
LEGACY_GROUP=io.github.kashif-mehmood-km
VERSION_NAME=2.0
POM_INCEPTION_YEAR=2024
POM_URL=https://github.com/Kashif-E/Kamera
POM_SCM_URL=https://github.com/Kashif-E/Kamera
POM_SCM_CONNECTION=scm:git:https://github.com/Kashif-E/Kamera.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/Kashif-E/Kamera.git
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_DEVELOPER_ID=Kashif-E
POM_DEVELOPER_NAME=Kashif
POM_DEVELOPER_EMAIL=kashismails@gmail.com
mavenCentralPublishing=true
signAllPublications=true
