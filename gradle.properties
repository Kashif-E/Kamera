#Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true
org.jetbrains.compose.experimental.macos.enabled=true
org.gradle.configuration-cache=false


#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

#Release coordinates and POM, shared by every published module. vanniktech maven-publish reads
#GROUP, VERSION_NAME and POM_*; each module's own gradle.properties adds POM_ARTIFACT_ID, POM_NAME
#and POM_DESCRIPTION. The root build sets project.group and project.version from the same keys.
GROUP=io.github.kashif-mehmood-km
VERSION_NAME=2.0
POM_INCEPTION_YEAR=2024
POM_URL=https://github.com/kashif-e/CameraK
POM_SCM_URL=https://github.com/kashif-e/CameraK
POM_LICENSE_NAME=MIT
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_DEVELOPER_ID=Kashif-E
POM_DEVELOPER_NAME=Kashif
POM_DEVELOPER_EMAIL=kashismails@gmail.com
mavenCentralPublishing=true
signAllPublications=true
