# Every test that does not pin its own SDK runs twice: at OLDEST_SDK, which Robolectric reads from the
# merged unit-test manifest (the library's minSdk), and at 35. Robolectric needs Java 21 to run API 36
# and above; the build runs on JDK 17, whose newest supported API is 35
# (https://robolectric.org/compatibility_table).
sdk=OLDEST_SDK,35
